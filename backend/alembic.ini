# Alembic Configuration File
# Generated for KisanRakshak backend
# The script_location path is relative to where `alembic` CLI is run
# (i.e. the backend/ directory).

[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is read from the environment variable DATABASE_URL
# (set in backend/.env) inside alembic/env.py.
# Do NOT put the real URL here — keep secrets out of version control.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
