<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="leafGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="60%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#fcfbf7"/>

  <!-- Leaf Base -->
  <path d="M 200,280 C 120,240 80,160 140,80 C 180,30 200,20 200,20 C 200,20 220,30 260,80 C 320,160 280,240 200,280 Z" fill="url(#leafGrad)"/>

  <!-- Main Veins -->
  <path d="M 200,280 Q 200,140 200,20" stroke="#a3e635" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 200,200 Q 150,170 120,160" stroke="#a3e635" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 200,200 Q 250,170 280,160" stroke="#a3e635" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 200,150 Q 150,120 130,105" stroke="#a3e635" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,150 Q 250,120 270,105" stroke="#a3e635" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200,100 Q 170,70 150,60" stroke="#a3e635" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 200,100 Q 230,70 250,60" stroke="#a3e635" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Rust Pustules Clusters -->
  <g fill="#92400e" stroke="#78350f" stroke-width="0.5">
    <circle cx="160" cy="140" r="4"/><circle cx="168" cy="144" r="3.5"/><circle cx="155" cy="150" r="3"/>
    <circle cx="174" cy="138" r="4"/><circle cx="162" cy="156" r="3"/><circle cx="170" cy="152" r="4.5"/>
    <circle cx="180" cy="148" r="3.5"/><circle cx="185" cy="158" r="3"/>
    <!-- Yellow halo around pustules -->
    <circle cx="168" cy="147" r="22" fill="#eab308" opacity="0.25"/>

    <circle cx="230" cy="130" r="4"/><circle cx="238" cy="125" r="3.5"/><circle cx="225" cy="138" r="3"/>
    <circle cx="242" cy="134" r="4.5"/><circle cx="235" cy="142" r="3"/><circle cx="248" cy="128" r="3"/>
    <circle cx="235" cy="133" r="18" fill="#eab308" opacity="0.25"/>

    <circle cx="180" cy="90" r="3.5"/><circle cx="187" cy="85" r="3"/><circle cx="175" cy="96" r="2.5"/>
    <circle cx="193" cy="92" r="3.5"/>
    <circle cx="184" cy="90" r="14" fill="#eab308" opacity="0.25"/>

    <circle cx="215" cy="190" r="4"/><circle cx="222" cy="196" r="3.5"/><circle cx="210" cy="202" r="3"/>
    <circle cx="228" cy="191" r="3"/>
    <circle cx="218" cy="195" r="16" fill="#eab308" opacity="0.25"/>
  </g>

  <!-- Diagnostic Tag -->
  <rect x="15" y="15" width="170" height="28" rx="6" fill="#d97706" opacity="0.9"/>
  <text x="25" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SAMPLE: SOYBEAN RUST</text>
</svg>
