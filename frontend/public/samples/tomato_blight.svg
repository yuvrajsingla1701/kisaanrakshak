<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fbfaf6"/>
  <defs>
    <radialGradient id="targetSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="35%" stop-color="#44403c"/>
      <stop offset="50%" stop-color="#78716c"/>
      <stop offset="65%" stop-color="#a8a29e"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tomato Leaflet Silhouette -->
  <path d="M 200,270 Q 195,200 170,180 Q 110,190 90,160 Q 120,130 110,100 Q 140,90 160,60 Q 200,20 200,20 Q 200,20 240,60 Q 260,90 290,100 Q 280,130 310,160 Q 290,190 230,180 Q 205,200 200,270 Z" fill="#4d7c0f"/>

  <!-- Veins -->
  <path d="M 200,270 Q 200,140 200,20" stroke="#84cc16" stroke-width="3" fill="none"/>
  <path d="M 200,180 Q 140,165 105,150" stroke="#84cc16" stroke-width="2" fill="none"/>
  <path d="M 200,180 Q 260,165 295,150" stroke="#84cc16" stroke-width="2" fill="none"/>
  <path d="M 200,120 Q 150,105 125,95" stroke="#84cc16" stroke-width="1.8" fill="none"/>
  <path d="M 200,120 Q 250,105 275,95" stroke="#84cc16" stroke-width="1.8" fill="none"/>

  <!-- Early Blight Concentric Target Spot 1 -->
  <ellipse cx="160" cy="140" rx="36" ry="30" fill="url(#targetSpot)"/>
  <ellipse cx="160" cy="140" rx="24" ry="20" fill="none" stroke="#292524" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="160" cy="140" rx="14" ry="11" fill="none" stroke="#1c1917" stroke-width="2.5"/>
  <circle cx="160" cy="140" r="5" fill="#0c0a09"/>

  <!-- Early Blight Target Spot 2 -->
  <ellipse cx="235" cy="115" rx="28" ry="24" fill="url(#targetSpot)"/>
  <ellipse cx="235" cy="115" rx="18" ry="15" fill="none" stroke="#292524" stroke-width="2" opacity="0.8"/>
  <ellipse cx="235" cy="115" rx="9" ry="8" fill="none" stroke="#1c1917" stroke-width="2"/>
  <circle cx="235" cy="115" r="4" fill="#0c0a09"/>

  <!-- Smaller satellite spot -->
  <ellipse cx="185" cy="85" rx="16" ry="14" fill="url(#targetSpot)"/>
  <circle cx="185" cy="85" r="3" fill="#0c0a09"/>

  <!-- Diagnostic Tag -->
  <rect x="15" y="15" width="180" height="28" rx="6" fill="#b91c1c" opacity="0.9"/>
  <text x="25" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SAMPLE: TOMATO BLIGHT</text>
</svg>
