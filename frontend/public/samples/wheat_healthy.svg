<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8faf6"/>

  <!-- Wheat Spike & Tillers -->
  <g stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 170,270 Q 180,180 160,80"/>
    <path d="M 200,280 Q 200,160 200,60"/>
    <path d="M 230,270 Q 220,180 240,80"/>
  </g>

  <!-- Wheat Spikelets -->
  <g fill="#22c55e" stroke="#15803d" stroke-width="1">
    <!-- Center Ear -->
    <ellipse cx="200" cy="70" rx="9" ry="14"/>
    <ellipse cx="193" cy="90" rx="8" ry="13"/>
    <ellipse cx="207" cy="90" rx="8" ry="13"/>
    <ellipse cx="194" cy="110" rx="8" ry="13"/>
    <ellipse cx="206" cy="110" rx="8" ry="13"/>
    <ellipse cx="196" cy="130" rx="8" ry="13"/>
    <ellipse cx="204" cy="130" rx="8" ry="13"/>
    <!-- Awns -->
    <line x1="200" y1="60" x2="200" y2="25" stroke="#15803d" stroke-width="1.5"/>
    <line x1="193" y1="80" x2="175" y2="50" stroke="#15803d" stroke-width="1.5"/>
    <line x1="207" y1="80" x2="225" y2="50" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- Diagnostic Tag -->
  <rect x="15" y="15" width="180" height="28" rx="6" fill="#15803d" opacity="0.9"/>
  <text x="25" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SAMPLE: HEALTHY WHEAT</text>
</svg>
