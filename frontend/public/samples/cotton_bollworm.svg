<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfcf8"/>
      <stop offset="100%" stop-color="#ede8df"/>
    </radialGradient>
    <radialGradient id="bollGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#93c47d"/>
      <stop offset="70%" stop-color="#4e7c38"/>
      <stop offset="100%" stop-color="#2d5020"/>
    </radialGradient>
    <linearGradient id="wormGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4a7b9"/>
      <stop offset="50%" stop-color="#ea638c"/>
      <stop offset="100%" stop-color="#b83b5e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Stem & Calyx -->
  <path d="M 200,40 Q 205,90 200,120" stroke="#385e2b" stroke-width="12" stroke-linecap="round"/>
  <path d="M 195,120 Q 150,110 130,130 Q 150,145 185,135" fill="#3d6b2c"/>
  <path d="M 205,120 Q 250,110 270,130 Q 250,145 215,135" fill="#3d6b2c"/>
  <path d="M 200,120 Q 200,160 190,165 Q 210,165 200,120" fill="#2d521f"/>

  <!-- Cotton Boll -->
  <path d="M 200,125 C 130,135 110,210 170,255 C 200,270 200,270 230,255 C 290,210 270,135 200,125 Z" fill="url(#bollGrad)"/>
  
  <!-- Boll Suture lines -->
  <path d="M 200,135 Q 200,200 200,265" stroke="#325a24" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 200,135 Q 165,195 175,250" stroke="#325a24" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 200,135 Q 235,195 225,250" stroke="#325a24" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Larval Entry Bore Hole & Frass -->
  <circle cx="175" cy="195" r="9" fill="#1e1810"/>
  <circle cx="175" cy="195" r="14" fill="#6d4c20" opacity="0.4"/>
  <circle cx="188" cy="202" r="3" fill="#4d3215"/>
  <circle cx="185" cy="186" r="2.5" fill="#4d3215"/>
  <circle cx="166" cy="205" r="3.5" fill="#38240d"/>
  
  <!-- Emerging Pink Bollworm Larva -->
  <path d="M 175,195 Q 195,185 215,195 Q 230,205 240,195" stroke="url(#wormGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Larva segments -->
  <circle cx="240" cy="195" r="5" fill="#6b1d34"/>
  <circle cx="242" cy="194" r="1.5" fill="#fff"/>
  <line x1="200" y1="187" x2="200" y2="195" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="215" y1="191" x2="215" y2="199" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="228" y1="195" x2="228" y2="203" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

  <!-- Diagnostic Tag -->
  <rect x="15" y="15" width="170" height="28" rx="6" fill="#dc2626" opacity="0.9"/>
  <text x="25" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SAMPLE: PINK BOLLWORM</text>
</svg>
