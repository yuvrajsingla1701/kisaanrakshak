<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8faf6"/>
  <defs>
    <radialGradient id="soyHealthy" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
  </defs>

  <!-- Trifoliate Soybean Leaf Arrangement -->
  <!-- Left Leaflet -->
  <path d="M 190,200 C 130,190 90,140 120,90 C 150,50 180,110 190,200 Z" fill="url(#soyHealthy)"/>
  <!-- Right Leaflet -->
  <path d="M 210,200 C 270,190 310,140 280,90 C 250,50 220,110 210,200 Z" fill="url(#soyHealthy)"/>
  <!-- Center Top Leaflet -->
  <path d="M 200,200 C 140,160 140,80 170,40 C 200,10 230,40 260,80 C 260,160 200,200 200,200 Z" fill="url(#soyHealthy)"/>
  <!-- Petiole -->
  <path d="M 200,200 Q 200,240 200,270" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>

  <!-- Diagnostic Tag -->
  <rect x="15" y="15" width="180" height="28" rx="6" fill="#15803d" opacity="0.9"/>
  <text x="25" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">SAMPLE: HEALTHY SOYBEAN</text>
</svg>
